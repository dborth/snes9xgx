name: Snes9x GX Build

on: [push, pull_request]

jobs:
  build:
    name: Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["Wii", "GameCube", "WiiU"]
    container: ghcr.io/extremscorner/libogc2:latest

    steps:
    - name: Checkout snes9xgx repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build and install libmocha
      if: ${{ matrix.image == 'WiiU' }}
      run: |
        git clone --depth 1 https://github.com/dborth/libmocha.git /tmp/libmocha
        cd /tmp/libmocha && make install

    - name: Build and install libdvm
      if: ${{ matrix.image == 'WiiU' }}
      run: |
        git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/dborth/libdvm.git /tmp/libdvm
        cd /tmp/libdvm && make install

    - name: Build and install libsmb2
      run: |
        git clone --depth 1 https://github.com/dborth/libsmb2.git /tmp/libsmb2
        cd /tmp/libsmb2
        if [ "${{ matrix.image }}" = "Wii" ]; then
          make -f Makefile.platform wii_install
        elif [ "${{ matrix.image }}" = "GameCube" ]; then
          make -f Makefile.platform gc_install
        elif [ "${{ matrix.image }}" = "WiiU" ]; then
          make -f Makefile.platform wiiu_install
        fi

    - name: Build Wii
      if: ${{ matrix.image == 'Wii' }}
      run: |
        make -f Makefile.wii -j3

    - name: Copy Wii artifacts
      if: ${{ matrix.image == 'Wii' }}
      run: |
        mkdir -p dist/Snes9xGX-Wii/apps/snes9xgx
        mkdir -p dist/Snes9xGX-Wii/snes9xgx/roms
        mkdir dist/Snes9xGX-Wii/snes9xgx/cheats
        mkdir dist/Snes9xGX-Wii/snes9xgx/saves
        touch dist/Snes9xGX-Wii/snes9xgx/roms/romsdir
        touch dist/Snes9xGX-Wii/snes9xgx/cheats/cheatsdir
        touch dist/Snes9xGX-Wii/snes9xgx/saves/savesdir
        cp hbc/* dist/Snes9xGX-Wii/apps/snes9xgx/
        cp executables/snes9xgx-wii.dol dist/Snes9xGX-Wii/apps/snes9xgx/boot.dol

    - name: Upload Wii artifacts
      uses: actions/upload-artifact@v4
      if: ${{ matrix.image == 'Wii' }}
      with:
        name: Snes9xGX-Wii
        path: |
          dist/Snes9xGX-Wii/

    - name: Build GameCube
      if: ${{ matrix.image == 'GameCube' }}
      run: |
        make -f Makefile.gc -j3

    - name: Copy GameCube artifact
      if: ${{ matrix.image == 'GameCube' }}
      run: |
        mkdir -p dist/Snes9xGX-GameCube
        cp executables/snes9xgx-gc.dol dist/Snes9xGX-GameCube/

    - name: Upload GameCube artifact
      uses: actions/upload-artifact@v4
      if: ${{ matrix.image == 'GameCube' }}
      with:
        name: Snes9xGX-GameCube
        path: |
          dist/Snes9xGX-GameCube/

    - name: Build Wii U
      if: ${{ matrix.image == 'WiiU' }}
      run: |
        make -f Makefile.wiiu -j3

    - name: Copy Wii U artifact
      if: ${{ matrix.image == 'WiiU' }}
      run: |
        mkdir -p dist/Snes9xGX-WiiU
        cp executables/snes9xgx-wiiu.wuhb dist/Snes9xGX-WiiU/

    - name: Upload Wii U artifact
      uses: actions/upload-artifact@v4
      if: ${{ matrix.image == 'WiiU' }}
      with:
        name: Snes9xGX-WiiU
        path: |
          dist/Snes9xGX-WiiU/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master'

    steps:
    - name: Checkout snes9xgx repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Re-zip artifacts
      run: |
        cd dist/Snes9xGX-Wii
        rm -r snes9xgx/cheats/*
        rm -r snes9xgx/roms/*
        rm -r snes9xgx/saves/*
        zip -r ../Snes9xGX-Wii.zip *
        cd ../Snes9xGX-GameCube
        zip -r ../Snes9xGX-GameCube.zip *

    - name: Update Git Tag
      run: |
        git tag -f Pre-release
        git push -f origin Pre-release

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        prerelease: true
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: false
        tag: Pre-release
        artifacts: "dist/*.zip"
